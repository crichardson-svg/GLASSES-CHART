<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=600, height=600, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>IWM Glasses Chart</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 600px;
      height: 600px;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .page {
      width: 600px;
      height: 600px;
      display: flex;
      flex-direction: column;
      background: #000;
    }
    #chart {
      flex: 1;
      width: 600px;
      min-height: 0;
      background: #000;
    }
    .tfs {
      height: 52px;
      display: flex;
      gap: 6px;
      padding: 6px;
      box-sizing: border-box;
      background: #000;
    }
    .tfs button {
      flex: 1;
      border: 1px solid #333;
      background: #111;
      color: #ddd;
      font-size: 16px;
      font-weight: 700;
      border-radius: 8px;
    }
    .tfs button.active {
      background: #FFD700;
      color: #000;
      border-color: #FFD700;
    }
    .tradingview-widget-copyright {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="page">
    <div id="chart"></div>
    <div class="tfs" id="tfs"></div>
  </div>
  <script>
    const TIMEFRAMES = [
      { id: "1", label: "1m" },
      { id: "5", label: "5m" },
      { id: "15", label: "15m" },
      { id: "30", label: "30m" },
      { id: "60", label: "1H" },
      { id: "D", label: "D" }
    ];

    function widgetConfig(interval) {
      return {
        autosize: true,
        symbol: "AMEX:IWM",
        interval: interval,
        timezone: "America/New_York",
        theme: "dark",
        style: "1",
        locale: "en",
        backgroundColor: "rgba(0, 0, 0, 1)",
        gridColor: "rgba(40, 40, 40, 0.4)",
        hide_top_toolbar: false,
        hide_legend: false,
        hide_side_toolbar: true,
        allow_symbol_change: true,
        save_image: false,
        calendar: false,
        hide_volume: true,
        studies: [
          { id: "MASimple@tv-basicstudies", inputs: { length: 50 } },
          { id: "MASimple@tv-basicstudies", inputs: { length: 200 } },
          { id: "PivotPointsStandard@tv-basicstudies" }
        ],
        studies_overrides: {
          "moving average.ma.color": "#FFD700",
          "moving average.ma.linewidth": 2,
          "moving average_1.ma.color": "#1E90FF",
          "moving average_1.ma.linewidth": 2
        },
        support_host: "https://www.tradingview.com"
      };
    }

    function loadChart(interval) {
      document.querySelectorAll(".tfs button").forEach(function (btn) {
        btn.classList.toggle("active", btn.dataset.tf === interval);
      });

      const holder = document.getElementById("chart");
      holder.innerHTML = "";
      const box = document.createElement("div");
      box.className = "tradingview-widget-container";
      box.style.width = "100%";
      box.style.height = "100%";
      const inner = document.createElement("div");
      inner.className = "tradingview-widget-container__widget";
      inner.style.width = "100%";
      inner.style.height = "100%";
      const script = document.createElement("script");
      script.type = "text/javascript";
      script.src = "https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";
      script.async = true;
      script.innerHTML = JSON.stringify(widgetConfig(interval));
      box.appendChild(inner);
      box.appendChild(script);
      holder.appendChild(box);
    }

    const bar = document.getElementById("tfs");
    TIMEFRAMES.forEach(function (tf) {
      const btn = document.createElement("button");
      btn.textContent = tf.label;
      btn.dataset.tf = tf.id;
      btn.addEventListener("click", function () {
        loadChart(tf.id);
      });
      bar.appendChild(btn);
    });

    const fromUrl = new URLSearchParams(location.search).get("tf");
    loadChart(fromUrl || "30");
  </script>
</body>
</html>
